name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'externals/**'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - '.ci/android/build.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - optimized
          - legacy
          - chromeos
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
          - RelWithDebInfo

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: android
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout (full history for version naming)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            glslang-tools \
            ninja-build \
            ccache \
            pkg-config \
            libssl-dev \
            python3 \
            git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install SDK platform + NDK + CMake
        run: |
          sdkmanager --install "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-standard-Release
          max-size: 2G

      - name: Build
        env:
          FLAVOR: standard
          TYPE: Release
          CCACHE: 'false'
          GIT_TAG_NAME: ${{ github.ref_name }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x .ci/android/build.sh
          ./.ci/android/build.sh -t "$FLAVOR" -b "$TYPE"

      - name: Show artifacts
        run: ls -lh artifacts/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB (optional)
        uses: actions/upload-artifact@v4
        with:
          name: eden-aab
          path: artifacts/*.aab
          if-no-files-found: ignore
          retention-days: 30
